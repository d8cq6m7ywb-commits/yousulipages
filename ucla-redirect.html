<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>UCLA Triathlon has moved</title>
  <style>
    body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
           background: #16324f; color: #fff; display: flex; align-items: center; justify-content: center;
           min-height: 100vh; text-align: center; }
    .box { padding: 40px 24px; max-width: 560px; }
    h1 { font-size: 1.6rem; margin: 0 0 10px; }
    p { color: #c8d4e0; margin: 0 0 24px; font-size: 1.02rem; line-height: 1.5; }
    a.btn { display: inline-block; background: #ffd100; color: #16324f; font-weight: 700;
            padding: 14px 28px; border-radius: 8px; text-decoration: none; font-size: 1.05rem; }
    a.plain { color: #ffd100; }
  </style>
</head>
<body>
  <script>
    (function () {
      try {
        if (window.top !== window.self) { window.top.location.replace('https://new.yousuli.co/ucla'); }
        else { window.location.replace('https://new.yousuli.co/ucla'); }
      } catch (e) {}
    })();
  </script>
  <div class="box">
    <h1>The UCLA Triathlon hub has moved.</h1>
    <p>Team sessions, the road to Nationals, conference racing, Grepiac setup, and everything else now lives on the new Yousuli site.</p>
    <p><a class="btn" href="https://new.yousuli.co/ucla" target="_top" rel="noopener">Take me there &#x2197;</a></p>
    <p style="font-size: 0.85rem;">Bookmark <a class="plain" href="https://new.yousuli.co/ucla" target="_top">new.yousuli.co/ucla</a></p>
  </div>
</body>
</html>
